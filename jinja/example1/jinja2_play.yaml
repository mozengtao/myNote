---
- hosts: localhost
  vars:
    interfaces:
      - name: Eth11
        p2p: 10.10.10.1/30
        description: TRANSIT-LINK
      - name: Eth12
        p2p: 10.10.20.1/30
        description: CUSTOMER-A
      - name: Eth13
        p2p: 10.10.30.1/30
        description: OUTSIDE

  tasks:
    - name: Generate interface configurations
      template:
        src: template.j2
        dest: "cisco.cfg"
      loop: "{{ interfaces }}"
